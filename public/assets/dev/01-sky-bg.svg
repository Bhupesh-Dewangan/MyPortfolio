<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B0E2E"/>
      <stop offset="35%" stop-color="#3D1B4E"/>
      <stop offset="60%" stop-color="#7A3468"/>
      <stop offset="82%" stop-color="#B85374"/>
      <stop offset="100%" stop-color="#D97F5C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#F0C79A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0C79A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet1" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#7C6A9C"/>
      <stop offset="100%" stop-color="#3A2E52"/>
    </radialGradient>
    <radialGradient id="planet2" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#5C8C7A"/>
      <stop offset="100%" stop-color="#254038"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="url(#sky)"/>
  <rect x="0" y="500" width="1920" height="580" fill="url(#glow)"/>

  <!-- distant planets -->
  <circle cx="180" cy="220" r="95" fill="url(#planet1)" opacity="0.85"/>
  <circle cx="380" cy="330" r="28" fill="#2C2340" opacity="0.8"/>
  <circle cx="1520" cy="150" r="14" fill="#3A2E52" opacity="0.7"/>
  <ellipse cx="140" cy="780" rx="260" ry="260" fill="url(#planet2)" opacity="0.6"/>

  <!-- stars -->
  <g fill="#F5E6EF" opacity="0.8">
    <circle cx="1650" cy="90" r="2.5"/>
    <circle cx="1720" cy="180" r="1.5"/>
    <circle cx="1580" cy="240" r="1.5"/>
    <circle cx="900" cy="60" r="1.5"/>
    <circle cx="750" cy="130" r="2"/>
    <circle cx="1100" cy="80" r="1.5"/>
    <circle cx="480" cy="90" r="2"/>
    <circle cx="1300" cy="60" r="1.5"/>
    <circle cx="1850" cy="260" r="2"/>
    <circle cx="60" cy="60" r="1.5"/>
  </g>

  <!-- faint nebula wisps -->
  <path d="M600 250 Q 900 180 1200 260 T 1800 300" stroke="#E8C9DE" stroke-width="2" fill="none" opacity="0.15"/>
  <path d="M200 400 Q 500 340 850 420 T 1500 440" stroke="#E8C9DE" stroke-width="1.5" fill="none" opacity="0.12"/>
</svg>
